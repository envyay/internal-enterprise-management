version: '3.9'
services:
  postgres:
    image: postgres:18
    container_name: postgres_db
    environment:
      POSTGRES_DB: iem
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456@An
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
  
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - ./qdrant_data:/qdrant/storage
  
volumes:
  postgres_data:
  qdrant_data: